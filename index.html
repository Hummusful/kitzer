<body>
  <a class="skip-link" href="#newsFeed">דלג לתוכן</a>
  <div class="shell">
    <header class="site-header" role="banner">
      <div class="signal-mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="brand-copy">
        <p class="eyebrow">Dusty’s</p>
        <h1 class="site-title"><a href="/" aria-label="קיצר — עמוד הבית">קיצר</a></h1>
      </div>
    </header>

    <div class="live-strip" aria-label="פיד חי">
      <span class="dot"></span>
      <span class="label">LIVE Music Feed</span>
    </div>

    <div class="navigation-bar">
      <nav id="contentNav" class="content-nav" aria-label="מדורי מוזיקה">
        <button type="button" class="active" data-section="home" aria-current="page">ראשי</button>
        <button type="button" data-section="israel" aria-current="false">ישראל</button>
        <button type="button" data-section="world" aria-current="false">עולם</button>
        <button type="button" data-section="hiphop" aria-current="false">היפ־הופ</button>
        <button type="button" data-section="electronic" aria-current="false">אלקטרוני</button>
        <button type="button" data-section="charts" aria-current="false">מצעדים</button>
      </nav>
      <div class="btn-group-secondary navigation-actions" role="group" aria-label="כלי האתר">
        <button id="themeToggle" class="btn ghost" type="button" title="החלף בין עיצוב בהיר לכהה" aria-label="החלף עיצוב תיאטרלי">🌙</button>
        <button id="refreshBtn" class="btn ghost" type="button" title="רענן את הפיד" aria-label="רענן את פיד המוזיקה">רענון</button>
      </div>
    </div>

    <div class="editorial-intro">
      <div>
        <p class="editorial-kicker">STORY RADAR</p>
      </div>
    </div>
    <section id="storyHero" class="story-hero" aria-labelledby="storyHeroTitle" hidden></section>

    <section id="editorialNow" class="editorial-now" aria-labelledby="editorialNowTitle" hidden>
      <div class="editorial-intro">
        <div>
          <p class="editorial-kicker">NOW PLAYING</p>
          <h2 id="editorialNowTitle">עכשיו במוזיקה</h2>
          <p>ארבעה סיפורים שכדאי להכיר לפני שממשיכים לפיד המלא.</p>
        </div>
      </div>
      <div id="editorialNowGrid" class="editorial-now-grid"></div>
    </section>

    <div id="editorialFeedHeading" class="editorial-feed-heading">
      <h2>כל החדשות</h2>
      <p>הפיד החי המלא מכל המקורות.</p>
    </div>

    <section id="chartsPanel" class="charts-panel" aria-labelledby="chartsTitle" hidden>
      <header class="charts-header">
        <div>
          <p class="charts-eyebrow">MEDIA FOREST</p>
          <h2 id="chartsTitle">המצעד השבועי</h2>
          <p id="chartsDateRange" class="charts-date-range"></p>
        </div>
        <a class="charts-source" href="https://mediaforest-group.com/weekly_charts.html" target="_blank" rel="noopener noreferrer">מקור: Media Forest</a>
      </header>
      <div class="category-controls chart-controls" aria-label="קטגוריית מצעדים" hidden>
        <span class="toolbar-label">סוג המצעד</span>
        <div class="btn-group" role="tablist" aria-label="סוג המצעד">
          <button class="btn chart-tab active" id="chart-israeliSongs" role="tab" data-chart="israeliSongs" aria-controls="chartContent" aria-selected="true">שירים ישראליים</button>
          <button class="btn chart-tab" id="chart-internationalSongs" role="tab" data-chart="internationalSongs" aria-controls="chartContent" aria-selected="false">שירים בינלאומיים</button>
          <button class="btn chart-tab" id="chart-israeliArtists" role="tab" data-chart="israeliArtists" aria-controls="chartContent" aria-selected="false">אמנים ישראליים</button>
          <button class="btn chart-tab" id="chart-internationalArtists" role="tab" data-chart="internationalArtists" aria-controls="chartContent" aria-selected="false">אמנים בינלאומיים</button>
        </div>
      </div>
      <div id="chartContent" class="chart-content" role="tabpanel" aria-labelledby="chart-israeliSongs" aria-live="polite" tabindex="0"></div>
    </section>

    <main id="newsFeed" class="news-feed" role="feed" aria-live="polite" aria-busy="true">
      <div class="loading-label" role="status"><span class="loader-equalizer" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span><span>מכוונים תדר...</span></div>
      <div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div>
    </main>
    <footer class="footer" role="contentinfo"><p>קיצר — Dusty’s Feed</p></footer>
  </div>
  <script src="./news-cache-refresh-v7.js?ready=1" defer></script>
  <script src="./app.js?v=unified-navigation-8" defer></script>
  <script src="./summary.js?v=private-access-7" defer></script>

</html>
