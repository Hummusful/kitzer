<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https://music-aggregator.dustrial.workers.dev; object-src 'none'; base-uri 'none';">
  <title>קיצר — Dusty’s Feed</title>
  <meta name="description" content="Kitzer Music Feed" />
  <meta name="robots" content="index,follow,max-image-preview:large" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="he_IL" />
  <meta property="og:site_name" content="קיצר" />
  <meta property="og:title" content="קיצר — Dusty’s Feed" />
  <meta property="og:description" content="Kitzer Music Feed" />
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"NewsMediaOrganization","name":"קיצר","inLanguage":"he"}
  </script>
  <meta name="theme-color" content="#080a12" />
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://music-aggregator.dustrial.workers.dev">
  <link rel="dns-prefetch" href="https://music-aggregator.dustrial.workers.dev">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="preload" href="./styles.css" as="style">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#newsFeed">דלג לתוכן</a>
  <div class="shell">
    <header class="site-header" role="banner">
      <div class="signal-mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="brand-copy">
        <p class="eyebrow">Kitzer Music Feed</p>
        <h1 class="site-title"><a href="/" aria-label="קיצר — עמוד הבית">קיצר</a></h1>
        
      </div>
    </header>

    <div class="live-strip" aria-label="פיד חי">
      <span class="dot"></span>
      <span class="label">LIVE</span>
      <span class="text">Kitzer Music Feed</span>
    </div>
    <section class="control-panel" aria-label="בקרת פיד">
      <nav class="toolbar" role="toolbar" aria-label="מסנני תוכן">
        <div class="btn-group" role="group" aria-label="סינון לפי ז'אנר">
          <button class="btn active" data-genre="all" aria-pressed="true">הכול</button>
          <button class="btn" data-genre="hebrew" aria-pressed="false">ישראלי</button>
          <button class="btn" data-genre="international" aria-pressed="false">בינלאומי</button>
          <button class="btn" data-genre="electronic" aria-pressed="false" lang="en">Electronic</button>
        </div>
        <button id="refreshBtn" class="btn ghost" type="button" title="רענן את הפיד">רענון</button>
      </nav>
    </section>
    <main id="newsFeed" class="news-feed" role="feed" aria-live="polite" aria-busy="true">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </main>
    <footer class="footer" role="contentinfo"><p>קיצר — Dusty’s Feed</p></footer>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
