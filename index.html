<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
 <meta
  http-equiv="Content-Security-Policy"
  content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' https: data:;
    connect-src 'self' https://music-aggregator.dustrial.workers.dev;
    object-src 'none';
    base-uri 'none';
  "
>
  <title>קיצר — הפיד של דאסטי</title>

  <!-- SEO בסיסי -->
  <meta name="description" content="חדשות מוזיקה נטו: ריליסים חדשים, אלבומים, סינגלים ועדכוני אמנים – בפיד אחד." />
  <meta name="robots" content="index,follow,max-image-preview:large" />

  <!-- Social preview -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="he_IL" />
  <meta property="og:site_name" content="קיצר" />
  <meta property="og:title" content="קיצר — חדשות מוזיקה" />
  <meta property="og:description" content="חדשות מוזיקה נטו: ריליסים, אלבומים, סינגלים ועדכוני אמנים." />

  <!-- Structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "NewsMediaOrganization",
    "name": "קיצר",
    "inLanguage": "he"
  }
  </script>

  <meta name="theme-color" content="#0f0f23" />
  <link rel="icon" href="/favicon.ico">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@800;900&display=swap" rel="stylesheet">

  <!-- Base styles -->
  <style>
    :root{--bg:#0f0f23;--panel:#141a2a;--muted:#9aa3b2;--accent:#FFC700;--tag:#2a3550;--text:#eaf0ff;}
    *{box-sizing:border-box;}
    html,body{height:100%;margin:0;padding:0;}
    body{color:var(--text);font-family:system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans","Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol";line-height:1.5;}
    .container{max-width:980px;margin:0 auto;padding:16px;}
    .skeleton{background:linear-gradient(90deg,#1f2a44 25%,#2a3550 50%,#1f2a44 75%);background-size:200% 100%;animation:shimmer 1.5s infinite linear;border-radius:14px;height:140px;margin:12px 0;}
    @keyframes shimmer{100%{background-position:-200% 0;}}
    .news-feed{min-height:40vh;}
  </style>

  <!-- API performance hints -->
  <link rel="preconnect" href="https://music-aggregator.dustrial.workers.dev">
  <link rel="dns-prefetch" href="https://music-aggregator.dustrial.workers.dev">
  <link rel="prefetch" href="https://music-aggregator.dustrial.workers.dev/api/music" as="fetch" crossorigin>

  <!-- Main stylesheet -->
  <link rel="preload" href="./styles.css" as="style">
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <a class="skip-link" href="#newsFeed">דלג לתוכן</a>

  <div class="container">
    <header class="site-header" role="banner">
      <h1 class="site-title">קיצר</h1>
      <p class="subtitle"><img src="Logo99.png" alt="logo99" aria-hidden="true">הפיד של דאסטי</p>
    </header>

    <nav class="toolbar" role="toolbar" aria-label="מסנני תוכן">
      <div class="btn-group" role="group" aria-label="Genre">
        <button class="btn active" data-genre="all" aria-pressed="true">הכול</button>
        <button class="btn" data-genre="hebrew" aria-pressed="false">ישראלי</button>
        <button class="btn" data-genre="international" aria-pressed="false">בינלאומי</button>
        <button class="btn" data-genre="electronic" aria-pressed="false">Electronic Music</button>
      </div>

      <div class="spacer"></div>
      <a href="https://open.spotify.com/playlist/37i9dQZF1DXcBWIGoYBM5M?si=35c59a20dbbe49ab" 
         class="btn spotify-btn" 
         target="_blank" 
         rel="noopener noreferrer" 
         title="Today's">
        Today's Top Hits
      </a>
      <button id="refreshBtn" class="btn ghost" type="button" title="רענן">רענון</button>
    </nav>

    <main id="newsFeed" class="news-feed" role="feed" aria-live="polite" aria-busy="true">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </main>

    <footer class="footer" role="contentinfo">
      <p>
        <img src="favicon-16x16.png" alt="לוגו קיצר" />
        קיצר - הפיד של דאסטי
      </p>
    </footer>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
