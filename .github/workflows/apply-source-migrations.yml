name: Apply KITZER source migrations
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-source-migrations.yml']
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations 0006 and 0007 to live D1
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 20; }
          test -n "$CF_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 21; }
          settings=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/music-aggregator/settings" -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')
          dbid=$(printf '%s' "$settings" | jq -r '.result.bindings[]? | select(.name=="KITZER_NEWS_DB" and .type=="d1") | (.database_id // .id)' | head -1)
          test -n "$dbid" && test "$dbid" != null || { echo 'KITZER_NEWS_DB binding not found'; exit 22; }
          for file in worker/migrations/0006_expand_hiphop_sources.sql worker/migrations/0007_add_yuval_erel_source.sql; do
            sql=$(cat "$file")
            payload=$(jq -n --arg sql "$sql" '{sql:$sql}')
            response=$(curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database/$dbid/query" -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' --data "$payload")
            printf '%s' "$response" | jq -e '.success == true and ([.result[]?.success] | all)' >/dev/null
          done
          verify_sql="SELECT slug,name,enabled,feed_url,last_checked_at,last_success_at,last_error FROM sources WHERE slug IN ('timeout-hiphop-il','hiphopdx','xxl','allhiphop','rap-radar','hip-hop-wired','yuval-erel') ORDER BY slug;"
          verify_payload=$(jq -n --arg sql "$verify_sql" '{sql:$sql}')
          verify=$(curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database/$dbid/query" -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' --data "$verify_payload")
          printf '%s' "$verify" | jq '.result[0].results'
