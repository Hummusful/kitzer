name: Deploy KITZER Summary Worker

on:
  push:
    branches:
      - feature/ai-kitzer-summary
    paths:
      - worker/summary-entry.js
      - worker/summary-worker.js
      - .github/cloudflare-summary-deploy-trigger

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      SCRIPT_NAME: kitzer-summary
    steps:
      - uses: actions/checkout@v4

      - name: Verify Cloudflare credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CF_API_TOKEN:-}" ]; then
            echo "Cloudflare API token secret is not configured in this repository." >&2
            exit 20
          fi
          if [ -z "${CF_ACCOUNT_ID:-}" ]; then
            echo "Cloudflare account ID secret is not configured in this repository." >&2
            exit 21
          fi
          echo "Cloudflare credentials are configured."

      - name: Verify existing AI and D1 bindings
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/settings" \
            -o /tmp/settings.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/settings.json'))
          assert data.get('success') is True, data.get('errors')
          bindings=data.get('result',{}).get('bindings') or []
          visible=[(b.get('name'),b.get('type')) for b in bindings]
          print('Existing bindings:', visible)
          assert any(b.get('name')=='AI' and b.get('type')=='ai' for b in bindings), visible
          assert any(b.get('name')=='KITZER_NEWS_DB' and b.get('type')=='d1' for b in bindings), visible
          PY

      - name: Update Worker code only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/content" \
            -F 'metadata={"main_module":"summary-entry.js"};type=application/json' \
            -F 'summary-entry.js=@worker/summary-entry.js;filename=summary-entry.js;type=application/javascript+module' \
            -F 'summary-worker.js=@worker/summary-worker.js;filename=summary-worker.js;type=application/javascript+module' \
            -o /tmp/upload.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/upload.json'))
          assert data.get('success') is True, data.get('errors')
          print('Cloudflare accepted the Worker code update.')
          PY

      - name: Verify live health and real AI summary with D1 cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys, time, urllib.request, urllib.error

          base='https://kitzer-summary.dustrial.workers.dev'
          origin='https://kitzer.net'
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36'
          articles=[
            ('MBW','https://www.musicbusinessworldwide.com/from-bmg-and-concords-completed-merger-to-anthropics-multi-billion-dollar-lawsuit-its-mbws-weekly-round-up/'),
            ('Trancentral','https://trancentral.tv/2026/09/trancentral-weekly-new-psytrance-releases-01-09-2026/'),
            ('Dancing Astronaut','https://dancingastronaut.com/2026/08/effin-on-sampling-the-past-and-creating-a-world-through-sound/'),
            ('קולומבוס','https://columbusmusicmagazine.com/2026/06/03/%d7%90%d7%99%d7%9f-%d7%a2%d7%a9%d7%9f-%d7%91%d7%9c%d7%99-%d7%90%d7%a9/'),
          ]

          time.sleep(2)
          h=urllib.request.Request(base+'/health',headers={'Origin':origin,'User-Agent':ua})
          with urllib.request.urlopen(h,timeout=15) as r:
            health=json.loads(r.read().decode())
          print('health:',json.dumps(health,ensure_ascii=False))
          assert health.get('ok') is True
          assert health.get('ai_binding') is True and health.get('d1_binding') is True

          def summarize(source,url):
            payload=json.dumps({'url':url,'title':'','source':source}).encode()
            req=urllib.request.Request(base+'/api/summarize',data=payload,method='POST',headers={
              'Origin':origin,'User-Agent':ua,'Content-Type':'application/json'})
            with urllib.request.urlopen(req,timeout=25) as r:
              return r.status,json.loads(r.read().decode())

          failures=[]
          for source,url in articles:
            try:
              status,body=summarize(source,url)
              print(source,'first:',json.dumps(body,ensure_ascii=False))
              if status!=200 or body.get('ok') is not True or len(body.get('summary') or '')<20:
                failures.append(f'{source}: invalid summary')
                continue
              status2,body2=summarize(source,url)
              print(source,'second:',json.dumps(body2,ensure_ascii=False))
              assert status2==200 and body2.get('ok') is True
              assert body2.get('cached') is True, body2
              assert body2.get('summary')==body.get('summary')
              print('LIVE SUMMARY + D1 CACHE VERIFIED')
              sys.exit(0)
            except urllib.error.HTTPError as exc:
              failures.append(f'{source}: HTTP {exc.code} '+exc.read().decode(errors='replace')[:500])
            except Exception as exc:
              failures.append(f'{source}: {type(exc).__name__}: {exc}')

          print('Deployment reached Cloudflare, but live summary verification failed:',file=sys.stderr)
          for failure in failures: print(' -',failure,file=sys.stderr)
          raise SystemExit(1)
          PY
