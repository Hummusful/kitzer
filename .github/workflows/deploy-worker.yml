name: Deploy existing KITZER API Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/worker.js"
      - "worker/story-radar.mjs"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

concurrency:
  group: kitzer-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '48364e65deb626ecaddfb97700090b65' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate deployment credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set repository secret CLOUDFLARE_API_TOKEN with Workers Scripts Edit permission. No deployment was attempted."
            exit 1
          fi
      - name: Deploy the existing music-aggregator Worker
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const base = 'https://api.cloudflare.com/client/v4/accounts/' + process.env.CLOUDFLARE_ACCOUNT_ID + '/workers/scripts/music-aggregator';
          const headers = { Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN };
          const settingsResponse = await fetch(base + '/settings', { headers });
          const settings = await settingsResponse.json();
          if (!settingsResponse.ok || !settings.success) throw new Error('Existing music-aggregator Worker could not be read; refusing deployment.');
          const current = settings.result;
          const d1 = current.bindings.find(binding => binding.name === 'KITZER_NEWS_DB' && binding.type === 'd1');
          if (!d1 || (d1.database_id || d1.id) !== '2b151508-380e-4741-8be5-6afe883344e6') throw new Error('Expected KITZER_NEWS_DB binding was not found; refusing deployment.');
          const form = new FormData();
          form.append('metadata', JSON.stringify({
            main_module: 'worker.js',
            compatibility_date: current.compatibility_date,
            compatibility_flags: current.compatibility_flags || [],
            keep_bindings: [...new Set(current.bindings.map(binding => binding.type))]
          }));
          form.append('worker.js', new Blob([readFileSync('worker/worker.js')], { type: 'application/javascript+module' }), 'worker.js');
          form.append('story-radar.mjs', new Blob([readFileSync('worker/story-radar.mjs')], { type: 'application/javascript+module' }), 'story-radar.mjs');
          const response = await fetch(base, { method: 'PUT', headers, body: form });
          const result = await response.json();
          if (!response.ok || !result.success) throw new Error(JSON.stringify(result.errors));
          console.log('Deployed existing music-aggregator:', result.result.deployment_id);
          NODE
