name: Deploy KITZER API Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "worker/worker.js"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --no-save wrangler@4

      - name: Resolve existing KITZER D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 list --json > "$RUNNER_TEMP/d1-list.json"
          node - <<'NODE'
          const fs = require('fs');
          const databases = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/d1-list.json', 'utf8'));
          const matches = databases.filter(db => /kitzer.*news|news.*kitzer/i.test(db.name || ''));
          if (matches.length !== 1) {
            const names = databases.map(db => db.name).join(', ');
            throw new Error(`Expected one KITZER news D1 database; found ${matches.length}. Available: ${names}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `database_id=${matches[0].uuid}\ndatabase_name=${matches[0].name}\n`);
          NODE

      - name: Create deployment configuration
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
          D1_DATABASE_NAME: ${{ steps.d1.outputs.database_name }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('wrangler.generated.json', JSON.stringify({
            name: 'kitzer-api',
            main: 'src/index.js',
            compatibility_date: '2026-09-12',
            keep_vars: true,
            d1_databases: [{
              binding: 'KITZER_NEWS_DB',
              database_name: process.env.D1_DATABASE_NAME,
              database_id: process.env.D1_DATABASE_ID
            }]
          }, null, 2));
          NODE

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.generated.json
