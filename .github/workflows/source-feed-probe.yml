name: Source Feed Probe
on:
  push:
    branches: [feature/source-expansion]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe candidate feeds
        shell: bash
        run: |
          set -uo pipefail
          urls=(
            'https://timeout.co.il/topic/%D7%94%D7%99%D7%A4-%D7%94%D7%95%D7%A4/feed/'
            'https://timeout.co.il/topic/%D7%9E%D7%95%D7%96%D7%99%D7%A7%D7%94/feed/'
            'https://hiphopdx.com/rss/news.xml'
            'https://www.xxlmag.com/feed/'
            'https://allhiphop.com/feed/'
            'https://rapradar.com/feed/'
            'https://hiphopwired.com/feed/'
          )
          for url in "${urls[@]}"; do
            echo "=== $url ==="
            tmp=$(mktemp)
            code=$(curl -L -A 'Mozilla/5.0' -sS --max-time 20 -o "$tmp" -w '%{http_code}' "$url" || true)
            ctype=$(curl -L -A 'Mozilla/5.0' -sSI --max-time 20 "$url" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type" {print $2}' | tail -1 || true)
            echo "HTTP=$code CONTENT_TYPE=$ctype BYTES=$(wc -c < "$tmp")"
            head -c 180 "$tmp" | tr '\n' ' '; echo
            if grep -Eqi '<rss|<feed|<channel|<item|<entry' "$tmp"; then echo 'FEED_MARKUP=yes'; else echo 'FEED_MARKUP=no'; fi
            rm -f "$tmp"
          done
