name: AI Summary Smoke Test

on:
  push:
    branches:
      - feature/ai-kitzer-summary
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check summary worker and summarize a live music article
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html, json, re, sys, urllib.request, urllib.error
          from urllib.parse import urlparse

          HEALTH='https://kitzer-summary.dustrial.workers.dev/health'
          SUMMARY='https://kitzer-summary.dustrial.workers.dev/api/summarize'
          ORIGIN='https://kitzer.net'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36'
          FEEDS=[
            ('MBW','https://www.musicbusinessworldwide.com/feed/'),
            ('Trancentral','https://trancentral.tv/feed/'),
            ('Dancing Astronaut','https://dancingastronaut.com/feed/'),
            ('The FADER','https://www.thefader.com/feed/rss'),
          ]

          def open_json(req, timeout):
            with urllib.request.urlopen(req, timeout=timeout) as r:
              return r.status, json.loads(r.read().decode('utf-8'))

          req=urllib.request.Request(HEALTH, headers={'Origin':ORIGIN,'User-Agent':UA})
          status,health=open_json(req,15)
          print('health:',json.dumps(health,ensure_ascii=False))
          assert status==200 and health.get('ok') is True
          assert health.get('ai_binding') is True and health.get('d1_binding') is True

          def first_article(feed_url):
            req=urllib.request.Request(feed_url,headers={'User-Agent':UA,'Accept':'application/rss+xml, application/xml, text/xml, */*'})
            with urllib.request.urlopen(req,timeout=12) as r:
              xml=r.read(1_200_000).decode('utf-8',errors='replace')
            patterns=[
              r'<link[^>]+rel=["\']alternate["\'][^>]+href=["\']([^"\']+)["\']',
              r'<link[^>]*>(?:<!\[CDATA\[)?\s*(https?://[^<\s]+?)\s*(?:\]\]>)?</link>',
              r'<guid[^>]*>(?:<!\[CDATA\[)?\s*(https?://[^<\s]+?)\s*(?:\]\]>)?</guid>',
            ]
            feed_host=urlparse(feed_url).hostname or ''
            for pattern in patterns:
              for raw in re.findall(pattern,xml,flags=re.I):
                link=html.unescape(raw).strip()
                host=urlparse(link).hostname or ''
                if not link.startswith(('http://','https://')) or not host:
                  continue
                if link==feed_url or link.rstrip('/').endswith('/feed') or '/feed/' in link:
                  continue
                # Prefer links on the same registrable site as the feed.
                if feed_host.split('.')[-2:] == host.split('.')[-2:]:
                  return link
            return None

          def summarize(link,source):
            data=json.dumps({'url':link,'title':'','source':source}).encode('utf-8')
            req=urllib.request.Request(SUMMARY,data=data,method='POST',headers={
              'Content-Type':'application/json','Origin':ORIGIN,'User-Agent':UA})
            return open_json(req,18)

          failures=[]
          for source,feed in FEEDS:
            try:
              link=first_article(feed)
              print(source,'candidate:',link)
              if not link:
                failures.append(source+': no article link')
                continue
              status,body=summarize(link,source)
              print(source,'summary:',json.dumps(body,ensure_ascii=False))
              if status!=200 or body.get('ok') is not True or len(body.get('summary') or '')<20:
                failures.append(f'{source}: bad summary {status} {body}')
                continue
              status2,body2=summarize(link,source)
              print(source,'cached:',json.dumps(body2,ensure_ascii=False))
              assert status2==200 and body2.get('ok') is True
              assert body2.get('cached') is True
              assert body2.get('summary')==body.get('summary')
              print('SMOKE TEST PASSED')
              sys.exit(0)
            except urllib.error.HTTPError as exc:
              failures.append(f'{source}: HTTP {exc.code} '+exc.read().decode('utf-8',errors='replace')[:500])
            except Exception as exc:
              failures.append(f'{source}: {type(exc).__name__}: {exc}')

          print('SMOKE TEST FAILED',file=sys.stderr)
          for f in failures: print(' -',f,file=sys.stderr)
          raise SystemExit(1)
          PY
