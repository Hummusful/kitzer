name: AI Summary Smoke Test

on:
  push:
    branches:
      - feature/ai-kitzer-summary
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check summary worker and summarize real KITZER articles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys, urllib.request, urllib.error

          HEALTH='https://kitzer-summary.dustrial.workers.dev/health'
          SUMMARY='https://kitzer-summary.dustrial.workers.dev/api/summarize'
          ORIGIN='https://kitzer.net'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36'
          ARTICLES=[
            ('מעריב - מוזיקה','https://www.maariv.co.il/culture/music/article-1363020'),
            ('MBW','https://www.musicbusinessworldwide.com/from-bmg-and-concords-completed-merger-to-anthropics-multi-billion-dollar-lawsuit-its-mbws-weekly-round-up/'),
            ('Trancentral','https://trancentral.tv/2026/09/trancentral-weekly-new-psytrance-releases-01-09-2026/'),
            ('Dancing Astronaut','https://dancingastronaut.com/2026/08/effin-on-sampling-the-past-and-creating-a-world-through-sound/'),
            ('קולומבוס','https://columbusmusicmagazine.com/2026/06/03/%d7%90%d7%99%d7%9f-%d7%a2%d7%a9%d7%9f-%d7%91%d7%9c%d7%99-%d7%90%d7%a9/'),
          ]

          def request_json(req, timeout=22):
            with urllib.request.urlopen(req,timeout=timeout) as r:
              return r.status,json.loads(r.read().decode('utf-8'))

          hreq=urllib.request.Request(HEALTH,headers={'Origin':ORIGIN,'User-Agent':UA})
          hs,health=request_json(hreq,15)
          print('health:',json.dumps(health,ensure_ascii=False))
          assert hs==200 and health.get('ok') is True
          assert health.get('ai_binding') is True and health.get('d1_binding') is True

          def summarize(source,url):
            payload=json.dumps({'url':url,'title':'','source':source}).encode('utf-8')
            req=urllib.request.Request(SUMMARY,data=payload,method='POST',headers={
              'Content-Type':'application/json','Origin':ORIGIN,'User-Agent':UA})
            return request_json(req,22)

          failures=[]
          for source,url in ARTICLES:
            try:
              status,body=summarize(source,url)
              print('\nARTICLE:',source,url)
              print('FIRST:',json.dumps(body,ensure_ascii=False))
              if status!=200 or body.get('ok') is not True or len(body.get('summary') or '')<20:
                failures.append(f'{source}: bad first response {status} {body}')
                continue

              status2,body2=summarize(source,url)
              print('SECOND:',json.dumps(body2,ensure_ascii=False))
              assert status2==200 and body2.get('ok') is True
              assert body2.get('cached') is True, body2
              assert body2.get('summary')==body.get('summary')
              print('SMOKE TEST PASSED')
              sys.exit(0)
            except urllib.error.HTTPError as exc:
              detail=exc.read().decode('utf-8',errors='replace')
              failures.append(f'{source}: HTTP {exc.code} {detail[:700]}')
            except Exception as exc:
              failures.append(f'{source}: {type(exc).__name__}: {exc}')

          print('SMOKE TEST FAILED',file=sys.stderr)
          for f in failures: print(' -',f,file=sys.stderr)
          raise SystemExit(1)
          PY
